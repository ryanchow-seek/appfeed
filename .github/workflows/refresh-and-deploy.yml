name: Refresh and Deploy App Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest


    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and convert HK CSV
        run: python scripts/build_datahk.py

      - name: Download and convert HK budget CSV
        run: python scripts/build_budgethk.py

      - name: Download and convert FY27 FX CSV
        run: python scripts/build_fy27fx.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages files
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
